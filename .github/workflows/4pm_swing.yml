name: 4PM Swing Daily Update

on:
  schedule:
    # 16:15 IST, Mon-Fri (= 10:45 UTC) — after NSE market close (15:30 IST)
    - cron: "45 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 4pm_swing
        run: python 4pm_swing.py

      - name: Commit updated tracker back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio_tracker.xlsx
          git diff --staged --quiet || git commit -m "Auto-update portfolio tracking Excel sheet [skip ci]"
          git push
