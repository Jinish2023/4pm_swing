name: Daily Strategy Scanner & Excel Updater

on:
  schedule:
    - cron: '30 10 * * 1-5' # Runs Monday to Friday at 10:30 UTC (4:00 PM IST)
  workflow_dispatch: # Allows manual runs from the GitHub Actions tab

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Required to allow the token to commit changes back

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance openpyxl

      - name: Run Production Scanner Script
        run: |
          python production/run_live_scanner.py

      - name: Commit and Push Excel Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update portfolio tracking Excel sheet [skip ci]"
          file_pattern: "portfolio_tracker.xlsx"